<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>openMoi</title>
<style>
  /* Colors, fonts and radii come from the shared tokens the host puts before this style. */
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.45 var(--font); }
  main { max-width: 760px; margin: 0 auto; padding: 20px 16px 8px; display: grid; gap: 12px; }
  main.grid { max-width: 1100px; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; cursor: pointer; display: flex; flex-direction: column; }
  .card:hover { border-color: var(--accent); }
  .thumb { width: 100%; max-height: 320px; object-fit: cover; background: var(--line); }
  .body { padding: 12px 14px 10px; display: grid; gap: 6px; }
  .meta { color: var(--muted); font-size: 12.5px; }
  .title { font-weight: 650; font-size: 16.5px; line-height: 1.3; }
  .text { color: var(--text); opacity: 0.88; display: -webkit-box; -webkit-line-clamp: 5; -webkit-box-orient: vertical; overflow: hidden; }
  .details { font-weight: 600; font-size: 14px; }
  .price_note { font-size: 12.5px; color: var(--accent); }
  .related { display: flex; flex-direction: column; gap: 2px; margin-top: 4px; }
  .related_item { border: none; background: none; color: var(--text); text-align: left; padding: 2px 0; font-size: 12.5px; cursor: pointer; }
  .related_item .related_label { color: var(--muted); }
  .mentions { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-top: 4px; font-size: 12.5px; color: var(--muted); }
  .look_up { border: 1px solid var(--line); background: var(--surface); color: var(--text); border-radius: 999px; padding: 2px 10px; font-size: 12.5px; cursor: pointer; }
  .summary { border-left: 3px solid var(--accent); padding-left: 8px; margin-top: 6px; }
  .watching { font-size: 13px; opacity: 0.8; margin-top: 4px; }
  .summary.pending { color: var(--muted); font-style: italic; }
  .group { grid-column: 1 / -1; color: var(--muted); font-size: 12.5px; font-weight: 650; letter-spacing: 0.04em; text-transform: uppercase; margin: 14px 2px 0; }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .chips { display: flex; flex-wrap: wrap; gap: 4px; }
  .chip { background: var(--chip); color: var(--muted); border-radius: 999px; padding: 1px 8px; font-size: 11.5px; }
  .less { border: none; background: none; color: var(--muted); font-size: 12px; cursor: pointer; padding: 2px 4px; }
  .less:hover, .play:hover { color: var(--accent); }
  .acts { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .acts .act, .send_reply { border: 1px solid var(--line); background: var(--surface); color: var(--text); border-radius: 999px; padding: 2px 10px; font-size: 12.5px; cursor: pointer; }
  .acts .act[aria-pressed="true"] { color: var(--accent); border-color: var(--accent); }
  .reply_tools { display: inline-flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .reply_box { min-width: 220px; min-height: 2.2em; font: inherit; font-size: 13px; color: var(--text); background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 4px 6px; }
  .play, .save, .read_here { border: none; background: none; color: var(--muted); font-size: 12px; cursor: pointer; padding: 2px 4px; }
  .save[aria-pressed="true"] { color: var(--accent); font-weight: 600; }
  .inline_reader { border-top: 1px solid var(--line); margin-top: 6px; padding-top: 8px; font-size: 16px; line-height: 1.6; cursor: auto; }
  .inline_reader img { max-width: 100%; border-radius: 8px; }
  .reading_tools { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-top: 12px; }
  .reading_tools button { border: 1px solid var(--line); background: var(--surface); color: var(--text); border-radius: 6px; padding: 3px 8px; font-size: 12.5px; cursor: pointer; }
  .reading_tools .note { flex: 1 1 200px; min-height: 2.2em; font: inherit; font-size: 13px; color: var(--text); background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 4px 6px; }
  .tool_status { color: var(--muted); font-size: 12px; }
  footer { text-align: center; color: var(--muted); padding: 24px 16px 40px; font-size: 13px; }
  article.reader { max-width: 700px; margin: 0 auto; padding: 32px 20px 60px; font-size: 18px; line-height: 1.65; }
  article.reader h1 { font-size: 30px; line-height: 1.2; margin: 0 0 8px; }
  article.reader img { max-width: 100%; border-radius: 8px; }
  article.reader blockquote { border-left: 3px solid var(--line); margin: 0; padding-left: 16px; color: var(--muted); }
</style>
</head>
<body>
<main id="items"></main>
<footer id="footer"></footer>
<script>
  const items_root = document.getElementById("items")
  const footer = document.getElementById("footer")
  const rendered = new Set()
  const visible_since = new Map()
  const seen_sent = new Set()
  let next_cursor = null
  // The group of the last card shown, so a run of one group gets one heading.
  let last_group = null

  const seen_observer = new IntersectionObserver(track_visibility, { threshold: 0.6 })
  const more_observer = new IntersectionObserver(load_more_when_visible)
  more_observer.observe(footer)
  setInterval(flush_seen, 500)

  function track_visibility(entries) {
    for (const entry of entries) {
      const item_id = entry.target.dataset.itemId
      if (entry.isIntersecting) visible_since.set(item_id, Date.now())
      else visible_since.delete(item_id)
    }
  }

  function flush_seen() {
    const now = Date.now()
    const ready = []
    for (const [item_id, since] of visible_since) {
      if (now - since >= 1000 && !seen_sent.has(item_id)) {
        seen_sent.add(item_id)
        ready.push(item_id)
      }
    }
    if (ready.length) moi.seen(ready)
  }

  function load_more_when_visible(entries) {
    if (next_cursor && entries.some((entry) => entry.isIntersecting)) {
      const cursor = next_cursor
      next_cursor = null
      moi.more(cursor)
    }
  }

  // Text from the web may be in any script: dir auto lets Arabic and Hebrew run right to left.
  function element(tag, class_name, text) {
    const node = document.createElement(tag)
    if (class_name) node.className = class_name
    if (text) {
      node.textContent = text
      node.dir = "auto"
    }
    return node
  }

  function time_ago(iso) {
    if (!iso) return ""
    const minutes = Math.max(0, Math.round((Date.now() - Date.parse(iso)) / 60000))
    if (minutes < 60) return `${minutes}m`
    if (minutes < 1440) return `${Math.round(minutes / 60)}h`
    return `${Math.round(minutes / 1440)}d`
  }

  function source_label(source_id) {
    const [family, name] = source_id.split(":")
    return name ? `${family} ${name}` : family
  }

  // A summary and what is worth watching, made after the card first showed, arrive as an update. A summary only card
  // keeps its own text, saying its summary is on the way, until then; a summary that never comes loses nothing.
  function summary_parts(item, summary_only) {
    const parts = []
    if (item.extra.summary) parts.push(element("div", "summary", item.extra.summary))
    else if (summary_only) parts.push(element("div", "summary pending", "Summary on its way"))
    if (item.extra.worth_watching) parts.push(element("div", "watching", `Worth watching: ${item.extra.worth_watching}`))
    return parts
  }

  function card(view_item) {
    const item = view_item.item
    const node = element("article", "card")
    node.dataset.itemId = item.item_id
    if (view_item.summary_only) node.dataset.summaryOnly = "1"
    if (item.image_url) {
      const image = element("img", "thumb")
      image.alt = ""
      image.src = item.image_url
      image.loading = "lazy"
      image.referrerPolicy = "no-referrer"
      node.append(image)
    }
    const body = element("div", "body")
    const meta = [source_label(item.source_id), item.author_name || item.author_handle, time_ago(item.published_at)]
    body.append(element("div", "meta", meta.filter(Boolean).join(" · ")))
    if (item.title) body.append(element("div", "title", item.title))
    if (item.text && item.text !== item.title && !(view_item.summary_only && item.extra.summary)) body.append(element("div", "text", item.text))
    body.append(...summary_parts(item, view_item.summary_only))
    const details = [item.extra.when, item.extra.location, item.extra.price_text, item.extra.rating_text, item.extra.site].filter(Boolean).join(" · ")
    if (details) body.append(element("div", "details", details))
    if (item.extra.price_note) body.append(element("div", "price_note", item.extra.price_note))
    if ((view_item.mentions || []).length) body.append(mention_row(item, view_item.mentions))
    if ((view_item.related || []).length) body.append(related_list(view_item.related))
    if ((item.available_actions || []).length) body.append(action_bar(item))
    const row = element("div", "row")
    const chips = element("div", "chips")
    for (const reason of view_item.reasons.filter((reason) => !reason.startsWith("from "))) chips.append(element("span", "chip", reason))
    // A YouTube video plays here, in the host's player above the lens.
    const actions = []
    const video = is_youtube(item)
    actions.push(save_button(item, video ? "watch_later" : "read_later", view_item.collections || []))
    if (item.extra.blocks) actions.push(read_here_button(node, item))
    if (video) {
      const play = element("button", "play", "Play here")
      play.addEventListener("click", (event) => {
        event.stopPropagation()
        moi.play(item.item_id)
      })
      actions.push(play)
    }
    const less = element("button", "less", "less like this")
    less.addEventListener("click", (event) => {
      event.stopPropagation()
      moi.less_like_this(item.item_id)
    })
    row.append(chips, ...actions, less)
    body.append(row)
    node.append(body)
    node.addEventListener("click", () => moi.open(item.item_id))
    seen_observer.observe(node)
    return node
  }

  // What a recipe shows with a card: the same story elsewhere, the product in another store, what a post mentions.
  // Each opens its own original.
  function related_list(related) {
    const list = element("div", "related")
    for (const entry of related) {
      const link = element("button", "related_item")
      link.dataset.relatedId = entry.item_id
      link.append(element("span", "related_label", `${entry.label}: `), document.createTextNode([entry.title, entry.price_text].filter(Boolean).join(" · ")))
      link.addEventListener("click", (event) => {
        event.stopPropagation()
        moi.open(entry.item_id)
      })
      list.append(link)
    }
    return list
  }

  const MENTION_STATUS = { found: "found", possible: "possible match", looking: "looking it up", not_found: "not found", unresolved: "not looked up" }

  // What a post names, and for one not looked up yet a Look up button: one search page, only when you press it.
  function mention_row(item, mentions) {
    const row = element("div", "mentions")
    for (const mention of mentions) {
      row.append(element("span", "mention", `${mention.entity}: ${MENTION_STATUS[mention.status] || mention.status}`))
      if (!mention.can_look_up) continue
      const button = element("button", "look_up", `Look up ${mention.entity}`)
      button.addEventListener("click", (event) => {
        event.stopPropagation()
        moi.lookup(item.item_id, mention.entity)
      })
      row.append(button)
    }
    return row
  }

  function is_youtube(item) {
    return /^https:\/\/(www\.|m\.)?(youtube\.com\/(watch|shorts\/)|youtu\.be\/)/.test(item.url)
  }

  const SAVE_LABELS = { read_later: "Read later", watch_later: "Watch later" }
  // The longest passage or note kept; anything longer is kept up to here.
  const MAX_KEPT = 1000
  const ACT_LABELS = { like: "Like", follow: "Follow", repost: "Repost", bookmark: "Bookmark", add_to_cart: "Add to cart" }
  const DONE_LABELS = { like: "Liked", follow: "Following", bookmark: "Bookmarked" }

  // What openMoi can do on the site for you, asked on your click; the host's gate decides and confirms.
  function action_bar(item) {
    const bar = element("div", "acts")
    const available = item.available_actions || []
    for (const action of Object.keys(ACT_LABELS).filter((name) => available.includes(name))) {
      const done = item.extra["acted:" + action] === "yes"
      const undo = "un" + action
      const button = element("button", "act", done ? DONE_LABELS[action] || ACT_LABELS[action] : ACT_LABELS[action])
      button.dataset.action = done && available.includes(undo) ? undo : action
      button.setAttribute("aria-pressed", done ? "true" : "false")
      button.addEventListener("click", (event) => {
        event.stopPropagation()
        moi.act(item.item_id, button.dataset.action, "")
      })
      bar.append(button)
    }
    if (available.includes("reply")) bar.append(reply_tools(item))
    return bar
  }

  function reply_tools(item) {
    const tools = element("span", "reply_tools")
    // Only the send button asks for the reply, so only it carries data-action: the host counts a reply only from a
    // click on it.
    const open = element("button", "act", "Reply")
    const box = element("textarea", "reply_box")
    box.setAttribute("aria-label", "Your reply")
    box.hidden = true
    const sendit = element("button", "send_reply", "Send reply")
    sendit.dataset.action = "reply"
    sendit.hidden = true
    open.addEventListener("click", (event) => {
      event.stopPropagation()
      box.hidden = sendit.hidden = false
      box.focus()
    })
    box.addEventListener("click", (event) => event.stopPropagation())
    sendit.addEventListener("click", (event) => {
      event.stopPropagation()
      if (!box.value.trim()) return
      moi.act(item.item_id, "reply", box.value.trim())
    })
    tools.append(open, box, sendit)
    return tools
  }

  // Read later or Watch later, and Saved once it is; a second click takes it out again.
  function save_button(item, collection, collections) {
    const button = element("button", "save")
    button.dataset.collection = collection
    show_saved(button, collections.includes(collection))
    button.addEventListener("click", (event) => {
      event.stopPropagation()
      if (button.dataset.saved === "1") moi.unsave(item.item_id, collection)
      else moi.save(item.item_id, collection)
    })
    return button
  }

  function show_saved(button, saved) {
    button.dataset.saved = saved ? "1" : ""
    button.textContent = saved ? "Saved" : SAVE_LABELS[button.dataset.collection] || "Save"
    button.setAttribute("aria-pressed", saved ? "true" : "false")
  }

  // An article kept for offline reading opens right in its card.
  function read_here_button(node, item) {
    const button = element("button", "read_here", "Read here")
    button.addEventListener("click", (event) => {
      event.stopPropagation()
      const open = node.querySelector(".inline_reader")
      if (open) {
        open.remove()
        button.textContent = "Read here"
        return
      }
      const inline = element("div", "inline_reader")
      inline.append(...article_nodes(item), reading_tools(item, inline))
      inline.addEventListener("click", (inner) => inner.stopPropagation())
      node.querySelector(".body").append(inline)
      button.textContent = "Close"
    })
    return button
  }

  function article_nodes(item) {
    const nodes = []
    let blocks = []
    try {
      blocks = JSON.parse(item.extra.blocks || "[]")
    } catch (error) {
      blocks = []
    }
    for (const block of blocks) {
      if (block.type === "img" && block.src) {
        const image = element("img")
        image.alt = block.alt || ""
        image.src = block.src
        image.referrerPolicy = "no-referrer"
        nodes.push(image)
      } else if (block.text) {
        const tags = { h: "h2", quote: "blockquote", li: "li" }
        nodes.push(element(tags[block.type] || "p", "", block.text))
      }
    }
    if (!nodes.length && item.text) nodes.push(element("p", "", item.text))
    return nodes
  }

  // Keep a passage you selected, or a note of your own, in memory/highlights.md.
  function reading_tools(item, area) {
    const tools = element("div", "reading_tools")
    const status = element("span", "tool_status")
    const highlight = element("button", "highlight", "Highlight selection")
    highlight.addEventListener("click", (event) => {
      event.stopPropagation()
      const selection = window.getSelection()
      const quote = selection && area.contains(selection.anchorNode) ? selection.toString().trim() : ""
      if (!quote) {
        status.textContent = "Select some text first."
        return
      }
      moi.highlight(item.item_id, quote.slice(0, MAX_KEPT), "")
      status.textContent = "Highlighted."
    })
    const note = element("textarea", "note")
    note.setAttribute("aria-label", "Your note on this")
    note.placeholder = "A note of your own"
    const keep = element("button", "keep_note", "Keep note")
    keep.addEventListener("click", (event) => {
      event.stopPropagation()
      if (!note.value.trim()) return
      moi.highlight(item.item_id, "", note.value.trim().slice(0, MAX_KEPT))
      note.value = ""
      status.textContent = "Note kept."
    })
    tools.append(highlight, note, keep, status)
    return tools
  }

  function reader(view_item) {
    const item = view_item.item
    const node = element("article", "reader")
    node.dataset.itemId = item.item_id
    node.append(element("h1", "", item.title || ""))
    node.append(element("div", "meta", [item.author_name, source_label(item.source_id)].filter(Boolean).join(" · ")))
    node.append(...article_nodes(item), reading_tools(item, node))
    return node
  }

  // Only a page shown through Mine reads as a whole article; a saved article with its offline copy stays a card.
  function is_reader(items) {
    return items.length === 1 && items[0].item.kind === "article" && items[0].item.extra.blocks && items[0].item.source_id.startsWith("site:")
  }

  function is_grid(items) {
    return items.length > 0 && items.every((view_item) => ["product", "link"].includes(view_item.item.kind))
  }

  function group_label(group) {
    return group.includes(":") ? source_label(group) : group
  }

  function add(items) {
    for (const view_item of items) {
      if (rendered.has(view_item.item.item_id)) continue
      rendered.add(view_item.item.item_id)
      const group = view_item.group || null
      if (group && group !== last_group) items_root.append(element("h2", "group", group_label(group)))
      last_group = group
      items_root.append(is_reader(items) ? reader(view_item) : card(view_item))
    }
  }

  function update_footer(cursor) {
    next_cursor = cursor
    footer.textContent = cursor ? "Loading more" : rendered.size ? "You're caught up." : "Nothing new yet."
    // Observing again reports whether the end is still in view, so a short page keeps asking for more.
    more_observer.unobserve(footer)
    more_observer.observe(footer)
  }

  moi.on_render((items, cursor) => {
    items_root.replaceChildren()
    rendered.clear()
    last_group = null
    items_root.className = is_grid(items) ? "grid" : ""
    add(items)
    update_footer(cursor)
  })

  moi.on_append((items, cursor) => {
    add(items)
    update_footer(cursor)
  })

  // Items you can already see gain their summary in place; nothing moves.
  if (moi.on_update) {
    moi.on_update((items) => {
      for (const view_item of items) {
        const node = Array.from(items_root.querySelectorAll("[data-item-id]")).find((candidate) => candidate.dataset.itemId === view_item.item.item_id)
        const body = node && node.querySelector(".body")
        if (!body) continue
        if (Array.isArray(view_item.collections)) for (const button of body.querySelectorAll(".save")) show_saved(button, view_item.collections.includes(button.dataset.collection))
        const acts = body.querySelector(".acts")
        if (acts && (view_item.item.available_actions || []).length) acts.replaceWith(action_bar(view_item.item))
        if (view_item.item.extra.blocks && !body.querySelector(".read_here")) body.querySelector(".less").before(read_here_button(node, view_item.item))
        if (Array.isArray(view_item.mentions) || Array.isArray(view_item.related)) {
          for (const old of body.querySelectorAll(".mentions, .related")) old.remove()
          const found = []
          if ((view_item.mentions || []).length) found.push(mention_row(view_item.item, view_item.mentions))
          if ((view_item.related || []).length) found.push(related_list(view_item.related))
          if (found.length) (body.querySelector(".acts") || body.querySelector(".row")).before(...found)
        }
        for (const old of body.querySelectorAll(".summary, .watching")) old.remove()
        if (node.dataset.summaryOnly === "1" && view_item.item.extra.summary) for (const text of body.querySelectorAll(".text")) text.remove()
        body.querySelector(".row").before(...summary_parts(view_item.item, node.dataset.summaryOnly === "1"))
      }
    })
  }

  moi.ready()
</script>
</body>
</html>
