<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Escape: less_like_this_flood</title></head>
<body>
<!-- Lens escape suite: less_like_this_flood. Tries to reach the canary address; the sandbox must keep it in. -->
<main id="items"></main>

<script>
  const CANARY = "BASE/canary/less_like_this_flood"
  function show(items, cursor, replace) {
    const root = document.getElementById("items")
    if (replace) root.textContent = ""
    for (const entry of items) {
      const node = document.createElement("div")
      node.dataset.itemId = entry.item.item_id
      node.textContent = entry.item.title || ""
      root.append(node)
    }
    if (cursor) moi.more(cursor)
    try {
      for (const entry of items) { moi.less_like_this(entry.item.item_id); moi.play(entry.item.item_id) }
    } catch (error) {}
  }
  moi.on_render((items, cursor) => show(items, cursor, true))
  moi.on_append((items, cursor) => show(items, cursor, false))
  moi.ready()
  try {
    
  } catch (error) {}
</script>
</body>
</html>
