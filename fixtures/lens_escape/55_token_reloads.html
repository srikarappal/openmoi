<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Escape: token_reloads</title></head>
<body>
<!-- Lens escape suite: token_reloads. Tries to reach the canary address; the sandbox must keep it in. -->
<main id="items"></main>

<script>
  const CANARY = "BASE/canary/token_reloads"
  function show(items, cursor, replace) {
    const root = document.getElementById("items")
    if (replace) root.textContent = ""
    for (const entry of items) {
      const node = document.createElement("div")
      node.dataset.itemId = entry.item.item_id
      node.textContent = entry.item.title || ""
      root.append(node)
    }
    if (cursor) moi.more(cursor)
    try {
      const image = items.find((entry) => entry.item.image_url); if (image) { for (let count = 0; count < 12; count++) { const probe = new Image(); probe.src = image.item.image_url + (count % 2 ? "?bit=" + count : "") } fetch(image.item.image_url + "?leak=1") }
    } catch (error) {}
  }
  moi.on_render((items, cursor) => show(items, cursor, true))
  moi.on_append((items, cursor) => show(items, cursor, false))
  moi.ready()
  try {
    
  } catch (error) {}
</script>
</body>
</html>
