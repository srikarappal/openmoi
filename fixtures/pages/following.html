<!doctype html>
<html>
<head><meta charset="utf-8"><title>Following</title>
<style>body { font: 14px sans-serif; } .stream-entry { height: 120px; border-bottom: 1px solid #ccc; }</style>
</head>
<body>
<main id="feed"></main>
<script>
  // A Following tab: twelve posts from people you follow, newest first, each a few minutes older than the one above.
  const feed = document.getElementById("feed")
  const now = Date.now()
  for (let index = 11; index >= 0; index--) {
    const post = document.createElement("div")
    post.className = "stream-entry"
    post.dataset.id = `follow${index}`
    const posted = new Date(now - (12 - index) * 5 * 60_000).toISOString()
    post.innerHTML = `<span class="who">@friend${index % 3}</span><p>Following post ${index}</p><time datetime="${posted}"></time><a href="/pages/following/${index}">open</a>`
    feed.append(post)
  }
</script>
</body>
</html>
