[project]
name = "moi_brain"
version = "0.1.0"
description = "openMoi brain: compiles your files, reads feeds, ranks items and generates lenses"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.8",
    "feedparser>=6.0",
    "httpx>=0.27",
    "websockets>=13",
    "cryptography>=44",
]

[dependency-groups]
dev = [
    "hypothesis>=6.170.15",
    "pytest>=8.0",
    "pytest-cov>=7.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["moi_brain"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["../fixtures"]
filterwarnings = [
    "ignore:Using `httpx` with `starlette.testclient`",
    "error::pytest.PytestUnhandledThreadExceptionWarning",
]

[tool.coverage.report]
exclude_also = ["if __name__ == .__main__.:"]

